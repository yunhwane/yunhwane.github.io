title: Yunhwan's Dev Blog
description: 개발과 기술에 대한 기록
url: "https://yunhwane.github.io"
baseurl: ""

# Author
author:
  name: yunhwane
  bio: "개발하면서 배운 것들을 기록합니다."

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Markdown
markdown: kramdown
highlighter: rouge

# Permalink
permalink: /:categories/:title/

# Pagination
show_excerpts: true

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
